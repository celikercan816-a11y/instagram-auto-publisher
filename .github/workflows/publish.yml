name: Publish scheduled Instagram content

on:
  schedule:
    # Every 15 minutes, offset to :07/:22/:37/:52 instead of the exact
    # quarter-hour (2026-09-03): GitHub explicitly documents that the top of
    # every hour (and, empirically, other round minutes like :15/:30/:45) is
    # high-load for Actions' scheduler and scheduled runs there are more
    # likely to be delayed or dropped outright -- an off-peak minute is
    # serviced more reliably. Even so, GitHub does not guarantee a schedule
    # fires on time or at all every tick; a late/skipped tick is not data
    # loss here -- get_due_items() (src/queue_manager.py) picks up anything
    # overdue on whatever run does eventually fire.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        id: run_publisher
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: python -m src.publisher

      - name: Commit updated queue and logs
        if: always()
        run: |
          git config user.name "instagram-auto-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in content_queue.json content_history.json logs/publish_log.jsonl; do
            [ -e "$f" ] && git add -- "$f"
          done
          git add --ignore-errors content_reserve || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update publish queue/log [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No changes to commit."
          fi

