name: Test publish remaining slots (one-off, cloud)

on:
  workflow_dispatch: {}

concurrency:
  group: instagram-content-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish_remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "instagram-auto-publisher-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Publish remaining planned slots for this week
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          TEST_PUBLISH_GAP_SECONDS: "420"
        run: python -m scripts.test_publish_today
