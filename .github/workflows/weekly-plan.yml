name: Generate weekly content plan

on:
  schedule:
    # Sundays ~06:00 UTC (09:00 Istanbul), offset off the hour (2026-09-03)
    - cron: "7 6 * * 0"
  workflow_dispatch: {}

concurrency:
  group: instagram-content-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # DISABLED 2026-09-01: generated old-style lifestyle/travel/style
      # weekly slots (content_planner.py) -- superseded by the quote+manzara
      # pivot. src/content_planner.py's generate_weekly_plan() itself now
      # refuses to run (ALLOW_LEGACY_PIPELINE guard) even if this step is
      # ever re-enabled by mistake. Re-enable only once this calls a
      # quote_v1 weekly/daily planner.
      - name: "[DISABLED] Legacy weekly plan (pre-pivot pipeline)"
        if: false
        run: python -m scripts.generate_weekly_plan

      - name: Commit plan
        run: |
          git config user.name "instagram-auto-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekly_content_plan.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly content plan [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No changes to commit."
          fi
