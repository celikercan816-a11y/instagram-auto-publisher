name: Generate weekly content plan

on:
  schedule:
    # Sundays 06:00 UTC (09:00 Istanbul)
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

concurrency:
  group: instagram-content-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly plan
        run: python -m scripts.generate_weekly_plan

      - name: Commit plan
        run: |
          git config user.name "instagram-auto-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekly_content_plan.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly content plan [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No changes to commit."
          fi
